<app-inspector-layout>

  <div class="page">

    <div class="page-header">
      <h1>My Inspections</h1>
      <p class="subtitle">History of inspections you've conducted</p>
    </div>

    <div class="filters-bar">
      <input type="text"
             placeholder="Search by industry or date..."
             [(ngModel)]="searchTerm"
             (ngModelChange)="applyFilters()" />

      <select [(ngModel)]="statusFilter" (ngModelChange)="applyFilters()">
        <option value="All">All Statuses</option>
        <option value="Compliant">Compliant</option>
        <option value="Non-Compliant">Non-Compliant</option>
        <option value="Under Review">Under Review</option>
      </select>

      <select [(ngModel)]="riskFilter" (ngModelChange)="applyFilters()">
        <option value="All">All Risk Levels</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>

      <input type="date"
             [(ngModel)]="dateFrom"
             (ngModelChange)="applyFilters()" />

      <input type="date"
             [(ngModel)]="dateTo"
             (ngModelChange)="applyFilters()" />

      <button (click)="resetFilters()">Reset</button>

      <button type="button"
              class="btn-pdf"
              (click)="downloadPdf()"
              [disabled]="filteredInspections.length === 0">
        ⬇ Download PDF
      </button>
    </div>

    <div class="table-card">
      <table class="inspections-table">
        <thead>
          <tr>
            <th>Industry</th>
            <th>Date</th>
            <th>Compliance</th>
            <th>Risk Level</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let insp of filteredInspections">
            <td>{{ insp.industryName }}</td>
            <td>{{ insp.date }}</td>
            <td><span class="badge" [ngClass]="statusClass(insp.complianceStatus)">{{ insp.complianceStatus }}</span></td>
            <td><span [ngClass]="riskClass(insp.riskLevel)">{{ insp.riskLevel }}</span></td>
            <td>{{ insp.notes }}</td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" *ngIf="filteredInspections.length === 0">
        No inspections match your filters.
      </div>
    </div>

  </div>

</app-inspector-layout>
