<app-inspector-layout>

  <div class="page">

    <div class="page-header">
      <h1>My Inspections</h1>
      <p class="subtitle">History of inspections you've conducted</p>
    </div>

    <div class="table-card">
      <table class="inspections-table">
        <thead>
          <tr>
            <th>Industry</th>
            <th>Date</th>
            <th>Compliance</th>
            <th>Risk Level</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let insp of inspections">
            <td>{{ insp.industryName }}</td>
            <td>{{ insp.date }}</td>
            <td><span class="badge" [ngClass]="statusClass(insp.complianceStatus)">{{ insp.complianceStatus }}</span></td>
            <td><span [ngClass]="riskClass(insp.riskLevel)">{{ insp.riskLevel }}</span></td>
            <td>{{ insp.notes }}</td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" *ngIf="inspections.length === 0">
        No inspections recorded yet.
      </div>
    </div>

  </div>

</app-inspector-layout>
