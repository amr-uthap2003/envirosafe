<app-layout>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>Manage Industries</h1>
        <p>View registered industries</p>
      </div>
      <span class="count">{{ industries?.length || 0 }} registered</span>
    </header>

    <div class="card">
      <table class="industry-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let i of industries">
            <td class="id">#{{ i.id }}</td>
            <td class="name">{{ i.name }}</td>
            <td>{{ i.location }}</td>
            <td><span class="badge">{{ i.type }}</span></td>
          </tr>
          <tr *ngIf="!industries?.length">
            <td colspan="4" class="empty">No industries registered yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</app-layout>
