<app-employee-layout>

  <div class="page">

    <div class="page-header">
      <h1>My Submissions</h1>
      <p class="subtitle">History of environmental readings you've submitted</p>
    </div>

    <div class="table-card">
      <table class="submissions-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Air Quality</th>
            <th>Water pH</th>
            <th>Noise (dB)</th>
            <th>Temp (°C)</th>
            <th>Waste Disposal</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sub of submissions">
            <td>{{ sub.date }}</td>
            <td>{{ sub.airQuality }}</td>
            <td>{{ sub.waterPh }}</td>
            <td>{{ sub.noiseLevel }}</td>
            <td>{{ sub.temperature }}</td>
            <td><span class="badge" [ngClass]="disposalClass(sub.wasteDisposal)">{{ sub.wasteDisposal }}</span></td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" *ngIf="submissions.length === 0">
        No submissions yet.
      </div>
    </div>

  </div>

</app-employee-layout>
