<app-employee-layout>

  <div class="page">

    <div class="page-header">
      <h1>Submit Reading</h1>
      <p class="subtitle">Record a new environmental check for your assigned industry</p>
    </div>

    <div class="form-card">

      <div class="form-row">
        <label>Air Quality (AQI) *</label>
        <input type="number" [(ngModel)]="airQuality" placeholder="e.g. 85" />
      </div>

      <div class="form-row">
        <label>Water pH *</label>
        <input type="number" step="0.1" [(ngModel)]="waterPh" placeholder="e.g. 7.2" />
      </div>

      <div class="form-row">
        <label>Noise Level (dB) *</label>
        <input type="number" [(ngModel)]="noiseLevel" placeholder="e.g. 68" />
      </div>

      <div class="form-row">
        <label>Temperature (°C) *</label>
        <input type="number" step="0.1" [(ngModel)]="temperature" placeholder="e.g. 27" />
      </div>

      <div class="form-row">
        <label>Waste Disposal</label>
        <select [(ngModel)]="wasteDisposal">
          <option value="Proper">Proper</option>
          <option value="Improper">Improper</option>
        </select>
      </div>

      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea [(ngModel)]="notes" rows="4" placeholder="Any additional observations..."></textarea>
      </div>

      <button class="submit-btn" (click)="submit()">Submit Reading</button>

    </div>

  </div>

</app-employee-layout>
