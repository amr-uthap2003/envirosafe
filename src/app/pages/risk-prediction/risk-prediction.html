<app-layout>

  <div class="risk-container">

    <div class="page-header">
      <div>
        <h1>Risk Prediction</h1>
        <p class="subtitle">Rule-based risk classification from current sensor readings</p>
      </div>

      <a routerLink="/industry-manager-dashboard" class="back-btn">
        ← Back to Dashboard
      </a>
    </div>

    <div class="overall-card" [ngClass]="getStatusClass(overallRisk)">
      <span>Overall Risk Level</span>
      <h2>{{ overallRisk }}</h2>
    </div>

    <table class="risk-table">
      <thead>
        <tr>
          <th>Parameter</th>
          <th>Value</th>
          <th>Status</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of riskItems">
          <td>{{ item.parameter }}</td>
          <td>{{ item.value }}</td>
          <td><span class="badge" [ngClass]="getStatusClass(item.status)">{{ item.status }}</span></td>
          <td>{{ item.reason }}</td>
        </tr>
      </tbody>
    </table>

  </div>

</app-layout>
