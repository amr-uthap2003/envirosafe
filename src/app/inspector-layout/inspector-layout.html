<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      🌿 <span>EnviroSafe</span>
    </div>

    <div class="profile">
      <div class="avatar">{{ initials }}</div>
      <div class="profile-info">
        <h3>{{ userName }}</h3>
        <p>{{ userRole }}</p>
      </div>
    </div>

    <nav>

      <a routerLink="/inspector-dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        📊
        <span>Dashboard</span>
      </a>

      <a routerLink="/inspect-industry"
         routerLinkActive="active">
        🔍
        <span>Inspect Industry</span>
      </a>

      <a routerLink="/my-inspections"
         routerLinkActive="active">
        📄
        <span>My Inspections</span>
      </a>

      <a routerLink="/my-recommendations"
         routerLinkActive="active">
        💡
        <span>Recommendations</span>
      </a>

      <a routerLink="/my-corrective-actions"
         routerLinkActive="active">
        🛠️
        <span>Corrective Actions</span>
      </a>

    </nav>

    <button class="logout" (click)="logout()">
      🚪 Logout
    </button>

  </aside>

  <main class="layout-content">
    <ng-content></ng-content>
  </main>

</div>
