<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      🌿 <span>EnviroSafe</span>
    </div>

    <div class="profile">
      <div class="avatar">{{ initials }}</div>
      <div class="profile-info">
        <h3>{{ userName }}</h3>
        <p>{{ userRole }}</p>
      </div>
    </div>

    <nav>

      <a routerLink="/industry-manager-dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        📊
        <span>Dashboard</span>
      </a>

      <a routerLink="/manage-industries"
         routerLinkActive="active">
        🏭
        <span>Industries</span>
      </a>

      <a routerLink="/environmental-data"
         routerLinkActive="active">
        🌱
        <span>Environmental Data</span>
      </a>

      <a routerLink="/employee-readings"
         routerLinkActive="active">
        👥
        <span>Employee Readings</span>
      </a>

      <a routerLink="/inspector-reports"
         routerLinkActive="active">
        📄
        <span>Inspector Reports</span>
      </a>

      <a routerLink="/compliance-standards"
         routerLinkActive="active">
        📋
        <span>Compliance Standards</span>
      </a>

      <a routerLink="/compliance-status"
         routerLinkActive="active">
        🛡️
        <span>Compliance Status</span>
      </a>

      <a routerLink="/risk-prediction"
         routerLinkActive="active">
        ⚠️
        <span>Risk Prediction</span>
      </a>

      <a routerLink="/recommendations"
         routerLinkActive="active">
        💡
        <span>Recommendations</span>
      </a>

      <a routerLink="/notifications"
         routerLinkActive="active"
         class="nav-item-with-badge">
        🔔
        <span>Notifications</span>
        <span class="nav-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>

      <a routerLink="/reports"
         routerLinkActive="active">
        📑
        <span>Reports</span>
      </a>

      <a routerLink="/corrective-actions"
         routerLinkActive="active">
        ⚙️
        <span>Corrective Actions</span>
      </a>

    </nav>

    <button class="logout" (click)="logout()">
      🚪 Logout
    </button>

  </aside>

  <main class="layout-content">
    <ng-content></ng-content>
  </main>

</div>
