<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      🌿 <span>EnviroSafe</span>
    </div>

    <div class="profile">
      <div class="avatar">{{ avatarLetter }}</div>
      <div class="profile-info">
        <h3>{{ fullName }}</h3>
        <p>{{ role }}</p>
      </div>
    </div>

    <nav>

      <a routerLink="/employee-dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        📊
        <span>Dashboard</span>
      </a>

      <a routerLink="/submit-reading"
         routerLinkActive="active">
        📝
        <span>Submit Reading</span>
      </a>

      <a routerLink="/my-submissions"
         routerLinkActive="active">
        📄
        <span>My Submissions</span>
      </a>

      <a routerLink="/my-recommendations"
         routerLinkActive="active">
        💡
        <span>Recommendations</span>
      </a>

      <a routerLink="/my-corrective-actions"
         routerLinkActive="active">
        🛠️
        <span>Corrective Actions</span>
      </a>

    </nav>

    <button class="logout" (click)="logout()">
      🚪 Logout
    </button>

  </aside>

  <main class="layout-content">
    <ng-content></ng-content>
  </main>

</div>
